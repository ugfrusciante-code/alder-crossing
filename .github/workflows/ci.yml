name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  # Electron is only needed to package the desktop app, never in CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
